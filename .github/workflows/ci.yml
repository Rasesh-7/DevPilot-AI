name: DevPilot AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Backend Code Quality (flake8)
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=120 --exclude=backend/__pycache__,backend/.venv --count --statistics || true

  frontend-build:
    name: Frontend Build & Type Check (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

  playwright-e2e:
    name: Playwright E2E Tests (Next.js)
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install --legacy-peer-deps

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Update Playwright Config for CI (chromium)
        working-directory: ./frontend
        run: |
          cat > playwright.config.ts << 'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: [['list'], ['html', { outputFolder: 'playwright-report', open: 'never' }]],
            use: {
              baseURL: 'http://localhost:3000',
              trace: 'on-first-retry',
              headless: true,
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
            webServer: {
              command: 'npm run start',
              url: 'http://localhost:3000',
              reuseExistingServer: !process.env.CI,
              timeout: 120 * 1000,
            },
          });
          EOF

      - name: Build Next.js for E2E
        working-directory: ./frontend
        run: npm run build

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  render-deploy:
    name: Render Backend Deployment
    needs: backend-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_SECRET != ''
        env:
          RENDER_SECRET: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Deployment..."
          curl -s -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Render Deployment Status
        run: |
          echo "Render deployment trigger step completed successfully."
